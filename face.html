<style>html,body{margin:0;height:100%;background:#000;overflow:hidden;user-select:none;-webkit-user-select:none;font-family:sans-serif;touch-action:manipulation}canvas{display:block;width:100vw;height:100vh}button{font:inherit;touch-action:none;user-select:none;-webkit-user-select:none;border:0;color:#fff;background:#ff7a00;border-radius:14px;font-weight:bold}#ui{position:fixed;inset:0;box-sizing:border-box;max-height:100vh;overflow:hidden;padding:8px 12px;color:#fff;background:rgba(10,18,30,.72);backdrop-filter:blur(5px);display:none;flex-direction:column;gap:8px}#ui.on{display:flex}.top{height:40px;flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px}.top button{height:36px;padding:0 12px;font-size:14px}.status{font-size:13px;white-space:nowrap}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#9299a3;margin-right:5px}.dot.connected{background:#27df79}.speed{font-size:13px}.speed input{width:12vw}#cam.active{background:#168b61}.controls{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;align-items:center}.cross{width:min(44vh,240px);height:min(44vh,240px);justify-self:center;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);gap:5px}.cross button{border-radius:50%;font-size:38px;min-width:72px;min-height:72px;padding:0}.cross [data-d=f]{grid-area:1/2}.cross [data-d=l]{grid-area:2/1}.cross [data-d=r]{grid-area:2/3}.cross [data-d=b]{grid-area:3/2}.arms{display:flex;justify-content:center;gap:5vw}.pair{display:flex;flex-direction:column;align-items:center;gap:6px}.pair button{width:clamp(88px,13vw,150px);height:clamp(60px,12vh,100px);font-size:16px}.emotions{display:flex;justify-content:center;gap:7px;flex:none}.emotions button{width:38px;height:38px;border-radius:50%;padding:0;font-size:21px;background:#2b6cb0}#hint{position:fixed;top:6px;right:10px;color:#444;font-size:12px;pointer-events:none}body:has(#ui.on) #brainStatus{display:block}#brainStatus button{font-size:12px;padding:6px 8px;margin-left:4px}#brainStatus{display:none;position:fixed;right:8px;bottom:58px;color:#fff;background:#111b;padding:4px 8px;border-radius:8px;font-size:12px;z-index:5}#brainToggle{font-size:12px;padding:4px 8px}</style></head><body>

<script>
/* ---------- Bluetooth: пакет AC 01 02 01 [8 моторов] сумма 35 ---------- */
const SVC=0xfff0,CH=0xfff2; let ch=null,m=new Array(8).fill(128),timer=null,stopT=null;
const st=document.getElementById('st'),sp=document.getElementById('sp'),dot=document.getElementById('dot');
const LEFT=1,ARM=2,RIGHT=3,CLAW=0;      // байты 5,6,7,4
const LEFT_FWD=1,RIGHT_FWD=-1;          // по пульту LEFbox: B вправо и D влево = вперёд
function pkt(){const p=[0xAC,1,2,1,...m];let s=0;for(const b of p)s+=b;p.push(s&255,0x35);return new Uint8Array(p)}
async function send(){if(!ch)return;try{await ch.writeValueWithoutResponse(pkt())}catch(e){try{await ch.writeValue(pkt())}catch(_){}}}
function v(dir,k=1){return Math.max(1,Math.min(255,Math.round(128+dir*k*(+sp.value))))}
document.getElementById('cn').onclick=async()=>{try{
 const d=await navigator.bluetooth.requestDevice({filters:[{namePrefix:'LFL'}],optionalServices:[SVC]});
 st.textContent='подключаю…';const g=await d.gatt.connect();ch=await(await g.getPrimaryService(SVC)).getCharacteristic(CH);
 st.textContent='Подключён';dot.classList.add('connected');face('happy',1500);d.addEventListener('gattserverdisconnected',()=>{ch=null;dot.classList.remove('connected');st.textContent='Отключился';face('sad',2000)});
 stop()}catch(e){st.textContent='ошибка: '+e.message}};
function run(){clearInterval(timer);send();timer=setInterval(send,100)}
function stop(){clearInterval(timer);clearTimeout(stopT);timer=null;m.fill(128);send();setTimeout(send,60)}
const drive={f:[1,1],b:[-1,-1],l:[-1,1],r:[1,-1]};
document.querySelectorAll('[data-d]').forEach(b=>{b.onpointerdown=e=>{e.preventDefault();const[l,r]=drive[b.dataset.d];
 m.fill(128);m[LEFT]=v(LEFT_FWD*l);m[RIGHT]=v(RIGHT_FWD*r);look(b.dataset.d);run()};b.onpointerup=b.onpointerleave=b.onpointercancel=()=>{stop();look('')}});
document.querySelectorAll('[data-m]').forEach(b=>{b.onpointerdown=e=>{e.preventDefault();const[i,dir]=b.dataset.m.split(',').map(Number);
 m.fill(128);
 if(i===CLAW){m[i]=Math.round(128+dir*127);run();stopT=setTimeout(stop,1500)} // клешня: тихо и не дольше 1,5 с
 else{m[i]=Math.round(128+dir*127);run()}};
 b.onpointerup=b.onpointerleave=b.onpointercancel=stop});
document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>face(b.dataset.f));
document.getElementById('hide').onclick=e=>{e.stopPropagation();ui.classList.remove('on')};
const ui=document.getElementById('ui');
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));

/* ---------- Лицо ---------- */
const c=document.getElementById('c'),x=c.getContext('2d');let W,H;
function rs(){const d=Math.min(devicePixelRatio||1,1.25);W=c.width=Math.round(innerWidth*d);H=c.height=Math.round(innerHeight*d)}addEventListener('resize',rs);rs();
let mood='normal',targetMood='normal',lastTouch=performance.now(),blink=0,nextBlink=performance.now()+1800,gx=0,gy=0,tx=0,ty=0,cameraTX=0,cameraTY=0,anim=0,moodChanged=performance.now();
let wakeLock=null,talk=0,speaking=false,lastBoundary=0,talkNoise=0;
function face(f,ms){if(targetMood!==f)moodChanged=performance.now();targetMood=f;lastTouch=performance.now();if(ms)setTimeout(()=>{if(targetMood===f)targetMood='normal'},ms)}
function look(d){tx=d.includes('l')?-1:d.includes('r')?1:0;ty=d==='b'?1:d.startsWith('f')?-.5:0}
window.faceInfo={seen:false,x:0,y:0,size:0};
function say(text,moodName='normal'){
 if(!('speechSynthesis'in window))return;
 speechSynthesis.cancel();face(moodName,Math.max(1400,text.length*100));
 const utterance=new SpeechSynthesisUtterance(text);utterance.lang='ru-RU';utterance.pitch=1.6;utterance.rate=1.05;
 speaking=true;lastBoundary=performance.now();talkNoise=0;
 utterance.onboundary=()=>{lastBoundary=performance.now();talkNoise=1;};
 utterance.onend=utterance.onerror=()=>{speaking=false;talk=0;};
 speechSynthesis.speak(utterance);
}
document.getElementById('sayHello').onclick=()=>say('Привет! Я твой робот. Давай дружить!','happy');
let cameraStream=null,wasSeen=false,faceClose=false;
const hiddenVideo=document.createElement('video');hiddenVideo.autoplay=true;hiddenVideo.muted=true;hiddenVideo.playsInline=true;hiddenVideo.style.cssText='position:fixed;width:1px;height:1px;opacity:0;pointer-events:none';document.body.appendChild(hiddenVideo);
function scanFace(){
 const fi=window.faceInfo||{};
 if(fi.seen){cameraTX=fi.x||0;cameraTY=fi.y||0;if(!wasSeen)face('happy',800);wasSeen=true;const close=fi.size>.45;if(close&&!faceClose)face('surprise',800);faceClose=close}
 else if(wasSeen){wasSeen=false;faceClose=false;tx=ty=0}
}
window.addEventListener('face-update',scanFace);
let camBusy=false;
document.getElementById('cam').onclick=async e=>{
 e&&e.stopPropagation();if(camBusy)return;camBusy=true;try{await camToggle()}finally{camBusy=false}};
async function camToggle(){
 if(cameraStream){document.getElementById('cam').classList.remove('active');cameraStream.getTracks().forEach(track=>track.stop());cameraStream=null;hiddenVideo.srcObject=null;window.vision.stop();window.faceInfo={seen:false,x:0,y:0,size:0};wasSeen=false;tx=ty=0;return}
 try{cameraStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:320,height:240}});hiddenVideo.muted=true;hiddenVideo.playsInline=true;hiddenVideo.srcObject=cameraStream;try{await hiddenVideo.play()}catch(pe){if(pe.name!=='AbortError')throw pe;await new Promise(r=>setTimeout(r,300));await hiddenVideo.play()}window.vision.start(hiddenVideo);document.getElementById('cam').classList.add('active');st.textContent='камера включена'}
 catch(e){if(cameraStream)cameraStream.getTracks().forEach(track=>track.stop());cameraStream=null;st.textContent='Камера недоступна: '+e.message}
};
async function enterScreen(){try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen()}catch(e){}try{await screen.orientation.lock('landscape')}catch(e){}try{wakeLock=await navigator.wakeLock.request('screen')}catch(e){}}
document.addEventListener('visibilitychange',async()=>{if(document.visibilityState==='visible'&&!wakeLock){try{wakeLock=await navigator.wakeLock.request('screen')}catch(e){}}});
function wake(){lastTouch=performance.now();if(targetMood==='sleep')face('happy')}
function touchReact(){enterScreen();wake();const a=['happy','surprise','love'];face(a[Math.floor(Math.random()*a.length)],850);anim=1}
let holdTimer=null,longHold=false;c.addEventListener('pointerdown',e=>{e.preventDefault();holdTimer=setTimeout(()=>{longHold=true;ui.classList.add('on');face('surprise',700)},700)});c.addEventListener('pointerup',()=>{clearTimeout(holdTimer);if(!longHold)touchReact();longHold=false});c.addEventListener('pointercancel',()=>clearTimeout(holdTimer));
// случайные гримасы убраны — эмоции только по делу
/* ---------- Лицо (рисует Claude): пружинные параметры, веки-шторки, гибкий рот ---------- */
// параметры: lid верх. веко 0..1, tilt наклон век (+ злой, - грустный), bot нижн. веко (улыбка глаз),
// pup зрачок, iris радужка, bu брови вверх, bt наклон бровей, ba асимметрия бровей,
// mw ширина рта, mc улыбка(+)/грусть(-), mo открыт, ms перекос, bl румянец, ht сердечки, gx/gy взгляд
const MOODS={
 normal:  {lid:.10,tilt:0,  bot:0,  pup:1,   iris:1,  bu:0,   bt:0,   ba:0,  mw:.50,mc:.55,mo:0,  ms:0, bl:.25,ht:0},
 happy:   {lid:0,  tilt:0,  bot:.55,pup:1.05,iris:1,  bu:.30, bt:-.1, ba:0,  mw:.70,mc:1,  mo:.50,ms:0, bl:.75,ht:0},
 love:    {lid:.04,tilt:0,  bot:.25,pup:1,   iris:1,  bu:.35, bt:-.25,ba:0,  mw:.55,mc:.9, mo:.22,ms:0, bl:1,  ht:1},
 surprise:{lid:0,  tilt:0,  bot:0,  pup:.62, iris:.86,bu:.75, bt:-.1, ba:0,  mw:.3,mc:0,  mo:.80,ms:0, bl:.2, ht:0},
 sad:     {lid:.30,tilt:-.7,bot:0,  pup:1.12,iris:1,  bu:.20, bt:-.9, ba:0,  mw:.42,mc:-.75,mo:.04,ms:0,bl:.1, ht:0},
 angry:   {lid:.32,tilt:.85,bot:.12,pup:.85, iris:1,  bu:-.25,bt:1,   ba:0,  mw:.42,mc:-.4,mo:.12,ms:0, bl:0,  ht:0},
 sly:     {lid:.45,tilt:.25,bot:.18,pup:1,   iris:1,  bu:0,   bt:.3,  ba:.7, mw:.48,mc:.6, mo:0,  ms:.6,bl:.35,ht:0},
 think:   {lid:.25,tilt:0,  bot:.08,pup:1,   iris:1,  bu:.25, bt:0,   ba:.55,mw:.28,mc:-.1,mo:.02,ms:.4,bl:.1, ht:0},
 sleep:   {lid:.97,tilt:-.1,bot:0,  pup:1,   iris:1,  bu:-.1, bt:0,   ba:0,  mw:.26,mc:.15,mo:0,  ms:0, bl:.25,ht:0}
};
const P={},PV={};for(const k in MOODS.normal){P[k]=MOODS.normal[k];PV[k]=0}
let sx=0,sy=0,nextSac=0,blinkDouble=false,bounce=0,bounceV=0;
function springAll(dt){const tg=MOODS[OV.mood||mood]||MOODS.normal;const s=dt/1000;
 for(const k in tg){const a=(tg[k]-P[k])*170-PV[k]*15;PV[k]+=a*s;P[k]+=PV[k]*s}
 const a=-bounce*260-bounceV*13;bounceV+=a*s;bounce+=bounceV*s}
function heartPath(r){x.beginPath();x.moveTo(0,r*.75);x.bezierCurveTo(-r*1.25,-.05*r,-r*.6,-r*1.05,0,-r*.42);x.bezierCurveTo(r*.6,-r*1.05,r*1.25,-.05*r,0,r*.75);x.closePath()}
function drawEye(cx,cy,u,s,t){
 const rx=u*.74,ry=u*.95;x.save();x.translate(cx,cy);
 const cl=Math.min(1,Math.max(P.lid,blink,OV.lid||0)),hp=Math.min(1,Math.max(0,(P.bot-.3)/.22));
 if(cl>.9||hp>0){x.strokeStyle="#eaf6ff";x.lineWidth=u*.15;x.lineCap="round";x.globalAlpha=cl>.9?1:hp;x.beginPath();if(cl>.9){x.moveTo(-rx*.8,0);x.quadraticCurveTo(0,ry*.45,rx*.8,0)}else{x.moveTo(-rx*.8,ry*.15);x.quadraticCurveTo(0,-ry*.65,rx*.8,ry*.15)}x.stroke();x.globalAlpha=1;if(cl>.9||hp>=1){x.restore();return}x.globalAlpha=1-hp}
 x.beginPath();x.ellipse(0,0,rx,ry,0,0,7);x.save();x.clip();
 // белок + тень сверху
 const sg=x.createLinearGradient(0,-ry,0,ry);sg.addColorStop(0,'#c9dcef');sg.addColorStop(.35,'#f4faff');sg.addColorStop(1,'#ffffff');x.fillStyle=sg;x.fillRect(-rx,-ry,rx*2,ry*2);
 const ix=gx*rx*.34,iy=gy*ry*.28,ir=rx*.74*P.iris;
 if(P.ht>.5){x.save();x.translate(ix,iy);const p=1+Math.sin(t/180)*.07;x.scale(p,p);x.fillStyle='#ff4f7e';heartPath(ir*1.05);x.fill();
  x.fillStyle='rgba(255,255,255,.85)';x.beginPath();x.ellipse(-ir*.38,-ir*.32,ir*.2,ir*.13,-.6,0,7);x.fill();x.restore()}
 else{x.save();x.translate(ix,iy);
  const g=x.createRadialGradient(0,ir*.25,ir*.1,0,0,ir);g.addColorStop(0,'#46c8ff');g.addColorStop(.55,'#1d78e0');g.addColorStop(.92,'#0d3a8c');g.addColorStop(1,'#08214f');
  x.fillStyle=g;x.beginPath();x.arc(0,0,ir,0,7);x.fill();
  x.fillStyle='#050b18';x.beginPath();x.arc(0,0,ir*.48*P.pup,0,7);x.fill();
  x.fillStyle='#fff';x.beginPath();x.ellipse(-ir*.36,-ir*.4,ir*.3,ir*.24,-.5,0,7);x.fill();
  x.globalAlpha=.85;x.beginPath();x.arc(ir*.34,ir*.32,ir*.11,0,7);x.fill();x.globalAlpha=1;x.restore()}
 // верхнее веко-шторка: inner (к носу) опускается при злости, outer — при грусти
 const c=Math.min(1,Math.max(P.lid,blink,OV.lid||0)),base=-ry+2*ry*c,inner=-s;
 const yIn=base+P.tilt*ry*.45*(1-c*.6),yOut=base-P.tilt*ry*.2*(1-c*.6)+(P.tilt<0?-P.tilt*ry*.35:0);
 const yL=inner<0?yIn:yOut,yR=inner<0?yOut:yIn;
 x.fillStyle=VIS;x.beginPath();x.moveTo(-rx-4,-ry-4);x.lineTo(rx+4,-ry-4);x.lineTo(rx+4,yR);x.quadraticCurveTo(0,(yL+yR)/2+ry*.22*(1-c),-rx-4,yL);x.closePath();x.fill();
 // нижнее веко: «улыбающиеся» глаза
 if(P.bot>.01){const yb=ry-P.bot*ry*1.25;x.beginPath();x.moveTo(-rx-4,ry+4);x.lineTo(rx+4,ry+4);x.lineTo(rx+4,yb+ry*.25);x.quadraticCurveTo(0,yb-P.bot*ry*.55,-rx-4,yb+ry*.25);x.closePath();x.fill()}
 x.restore();x.globalAlpha=1;x.restore()}
function drawBrow(cx,cy,u,s){
 const rx=u*.74,ry=u*.95,inner=-s,asym=s>0?P.ba:-P.ba*.3;
 const by=cy-ry*1.22-P.bu*ry*.38-asym*ry*.3;
 const xi=cx+inner*rx*.75,xo=cx-inner*rx*.95,yi=by+P.bt*ry*.32,yo=by-P.bt*ry*.12;
 x.strokeStyle='#8fe3ff';x.lineCap='round';x.lineWidth=u*.17;x.beginPath();x.moveTo(xo,yo);x.quadraticCurveTo(cx,Math.min(yi,yo)-ry*.16,xi,yi);x.stroke()}
function drawMouth(cx,cy,u,t){
 let w=u*P.mw,c=P.mc,o=Math.max(P.mo,OV.mo||0);
 if(speaking&&talk>.01){o=Math.max(o,.15+talk*.75);const k=Math.sin(t/140)*.5+.5;w*=1-talk*.3*k}
 const cy0=-c*u*.2,sk=P.ms*u*.12;
 const lx=-w,ly=cy0+sk,rx=w,ry=cy0-sk,up=c*u*.08,lo=up+o*u*.85+Math.max(0,c)*o*u*.25;
 x.save();x.translate(cx,cy);x.beginPath();x.moveTo(lx,ly);x.quadraticCurveTo(0,up*2-(ly+ry)/2,rx,ry);x.quadraticCurveTo(0,lo*2-(ly+ry)/2,lx,ly);x.closePath();
 if(o>.04){x.fillStyle='#2a0c1e';x.fill();if(o>.28){x.save();x.clip();x.fillStyle='#ff6f94';x.beginPath();x.ellipse(0,lo*.92,w*.42,u*.16,0,0,7);x.fill();x.restore()}}
 x.strokeStyle='#ff8fb0';x.lineWidth=u*.085;x.lineJoin='round';x.lineCap='round';x.stroke();x.restore()}
// ---------- тело: шея, корпус с экраном-сердцем, руки на пружинах, гусеницы ----------
// позы рук: [левая, правая], каждая [плечо, локоть]; угол от «вниз», + наружу
const ARMS={normal:[[.25,-.2],[.25,-.2]],happy:[[1.85,.75],[1.85,.75]],love:[[.35,-2.2],[.35,-2.2]],surprise:[[1.9,.6],[1.9,.6]],
 sad:[[.06,0],[.06,0]],angry:[[.95,-2.4],[.95,-2.4]],think:[[.25,-.2],[1.05,-2.75]],sly:[[.95,-2.4],[.3,-.1]],sleep:[[.08,0],[.08,0]]};
const arm=[[.25,-.2,0,0],[.25,-.2,0,0]];let tread=0,gest=null,gestUntil=0;

function armTarget(q,t){const i=q<0?0:1;if(OV.arms&&OV.arms[i])return OV.arms[i];let [a1,a2]=(ARMS[mood]||ARMS.normal)[i];
 if(t<gestUntil){if(gest==='wave'&&q>0){a1=2.5;a2=.5+Math.sin(t/110)*.55}
  else if(gest==='dance'){const p=Math.sin(t/260+(q<0?0:Math.PI));a1=1.2+p*.9;a2=p*.6}
  else if(gest==='clap'){a1=.9;a2=-1.9-Math.abs(Math.sin(t/120))*.5}
  else if(gest==='nod'){a1=.4;a2=-.3}}
 else if(speaking&&talk>.05&&mood!=='sleep'){a2+=Math.sin(t/400+i*2)*.1*talk;a1+=Math.sin(t/520+i)*.05}
 else{a1+=Math.sin(t/1400+i*1.7)*.05}
 return [a1,a2]}
function drawBody(t,dt,hw,neckY){
 const cx=W/2,s=hw/400,bw=hw*.62,bh=H*.27,by=neckY+H*.05,ty=by+bh+H*.01,tw=hw*.82,th=Math.min(H*.12,H-ty-2);
 // гусеницы (крутятся, когда робот едет)
 const mv=typeof m!=='undefined'?((m[LEFT]-128)*LEFT_FWD+(m[RIGHT]-128)*RIGHT_FWD)/2:0;tread=(tread+mv*dt*.004)%1;
 for(const q of[-1,1]){const x0=cx+q*tw*.27-tw*.23;x.fillStyle='#2b3442';x.beginPath();x.roundRect(x0,ty,tw*.46,th,th/2);x.fill();
  x.fillStyle='#4a5668';const n=7;for(let i=0;i<n;i++){const px=x0+((i+tread)%n)/n*tw*.46;x.fillRect(px,ty+1,tw*.022,th*.18);x.fillRect(px,ty+th*.82-1,tw*.022,th*.18)}
  x.fillStyle='#8a97a8';for(let i=0;i<3;i++){x.beginPath();x.arc(x0+th/2+i*(tw*.46-th)/2,ty+th/2,th*.28,0,7);x.fill()}}
 // шея
