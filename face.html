<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<link rel="manifest" href="manifest.webmanifest">
<title>Лицо робота</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;user-select:none;-webkit-user-select:none;font-family:sans-serif}
canvas{display:block;width:100vw;height:100vh}
#ui{position:fixed;inset:auto 0 0 0;display:none;background:rgba(20,20,20,.85);padding:8px;color:#eee}
#ui.on{display:block}
.g{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;margin:4px 0}
button{font-size:18px;padding:12px 14px;border:0;border-radius:10px;background:#ff7a00;color:#fff;touch-action:none;min-width:56px}
button.e{background:#2b6cb0}button.s{background:#555}
#st{font-size:14px;text-align:center}
#hint{position:fixed;top:6px;right:10px;color:#444;font-size:12px}
#hint{pointer-events:none}
</style></head><body>
<canvas id="c"></canvas>
<div id="hint">коснитесь лица — пульт</div>
<div id="ui">
 <div id="st">не подключён</div>
 <div class="g"><button id="cn">Подключить</button><button class="s" id="hide">Скрыть</button>
  скорость <input id="sp" type="range" min="30" max="127" value="80"></div>
 <div class="g"><button id="cam" class="s">Камера вкл/выкл</button><button id="sayHello" class="s">Скажи привет</button></div>
 <div class="g">
  <button data-d="fl">↖</button><button data-d="f">▲</button><button data-d="fr">↗</button>
  <button data-d="l">◀</button><button data-d="b">▼</button><button data-d="r">▶</button>
 </div>
 <div class="g">
  <button data-m="0,1">клешня A▲</button><button data-m="0,-1">клешня A▼</button>
  <button data-m="2,1">рука C▲</button><button data-m="2,-1">рука C▼</button>
 </div>
 <div class="g">
  <button class="e" data-f="happy">радость</button><button class="e" data-f="sad">грусть</button>
  <button class="e" data-f="surprise">удивление</button><button class="e" data-f="sleep">сон</button>
  <button class="e" data-f="angry">злость</button><button class="e" data-f="sly">хитрость</button><button class="e" data-f="think">думает</button><button class="e" data-f="love">любовь</button><button class="e" data-f="normal">обычное</button>
 </div>
</div>
<script>
/* ---------- Bluetooth: пакет AC 01 02 01 [8 моторов] сумма 35 ---------- */
const SVC=0xfff0,CH=0xfff2; let ch=null,m=new Array(8).fill(128),timer=null,stopT=null;
const st=document.getElementById('st'),sp=document.getElementById('sp');
const LEFT=1,ARM=2,RIGHT=3,CLAW=0;      // байты 5,6,7,4
const LEFT_FWD=1,RIGHT_FWD=-1;          // по пульту LEFbox: B вправо и D влево = вперёд
function pkt(){const p=[0xAC,1,2,1,...m];let s=0;for(const b of p)s+=b;p.push(s&255,0x35);return new Uint8Array(p)}
async function send(){if(!ch)return;try{await ch.writeValueWithoutResponse(pkt())}catch(e){try{await ch.writeValue(pkt())}catch(_){}}}
function v(dir,k=1){return Math.max(1,Math.min(255,Math.round(128+dir*k*(+sp.value))))}
document.getElementById('cn').onclick=async()=>{try{
 const d=await navigator.bluetooth.requestDevice({filters:[{namePrefix:'LFL'}],optionalServices:[SVC]});
 st.textContent='подключаю…';const g=await d.gatt.connect();ch=await(await g.getPrimaryService(SVC)).getCharacteristic(CH);
 st.textContent='подключён';face('happy',1500);d.addEventListener('gattserverdisconnected',()=>{ch=null;st.textContent='отключился';face('sad',2000)});
 stop()}catch(e){st.textContent='ошибка: '+e.message}};
function run(){clearInterval(timer);send();timer=setInterval(send,100)}
function stop(){clearInterval(timer);clearTimeout(stopT);timer=null;m.fill(128);send();setTimeout(send,60)}
const drive={f:[1,1],b:[-1,-1],l:[-1,1],r:[1,-1],fl:[.4,1],fr:[1,.4]};
document.querySelectorAll('[data-d]').forEach(b=>{b.onpointerdown=e=>{e.preventDefault();const[l,r]=drive[b.dataset.d];
 m.fill(128);m[LEFT]=v(LEFT_FWD*l);m[RIGHT]=v(RIGHT_FWD*r);look(b.dataset.d);run()};b.onpointerup=b.onpointerleave=b.onpointercancel=()=>{stop();look('')}});
document.querySelectorAll('[data-m]').forEach(b=>{b.onpointerdown=e=>{e.preventDefault();const[i,dir]=b.dataset.m.split(',').map(Number);
 m.fill(128);
 if(i===CLAW){m[i]=Math.round(128+dir*45);run();stopT=setTimeout(stop,1500)} // клешня: тихо и не дольше 1,5 с
 else{m[i]=v(dir,.7);run()}};
 b.onpointerup=b.onpointerleave=b.onpointercancel=stop});
document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>face(b.dataset.f));
document.getElementById('hide').onclick=e=>{e.stopPropagation();ui.classList.remove('on')};
const ui=document.getElementById('ui');
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));

/* ---------- Лицо ---------- */
const c=document.getElementById('c'),x=c.getContext('2d');let W,H;
function rs(){const d=Math.min(devicePixelRatio||1,2);W=c.width=Math.round(innerWidth*d);H=c.height=Math.round(innerHeight*d)}addEventListener('resize',rs);rs();
let mood='normal',targetMood='normal',lastTouch=performance.now(),blink=0,nextBlink=performance.now()+1800,gx=0,gy=0,tx=0,ty=0,anim=0,moodChanged=performance.now();
let wakeLock=null,talk=0,speaking=false,lastBoundary=0,talkNoise=0;
function face(f,ms){if(targetMood!==f)moodChanged=performance.now();targetMood=f;lastTouch=performance.now();if(ms)setTimeout(()=>{if(targetMood===f)targetMood='normal'},ms)}
function look(d){tx=d.includes('l')?-1:d.includes('r')?1:0;ty=d==='b'?1:d.startsWith('f')?-.5:0}
window.faceInfo={seen:false,x:0,y:0,size:0};
function say(text,moodName='normal'){
 if(!('speechSynthesis'in window))return;
 speechSynthesis.cancel();face(moodName,Math.max(1400,text.length*100));
 const utterance=new SpeechSynthesisUtterance(text);utterance.lang='ru-RU';utterance.pitch=1.6;utterance.rate=1.05;
 speaking=true;lastBoundary=performance.now();talkNoise=0;
 utterance.onboundary=()=>{lastBoundary=performance.now();talkNoise=1;};
 utterance.onend=utterance.onerror=()=>{speaking=false;talk=0;};
 speechSynthesis.speak(utterance);
}
document.getElementById('sayHello').onclick=()=>say('Привет! Я твой робот. Давай дружить!','happy');
let cameraStream=null,detector=null,mpDetector=null,cameraTimer=null,lastFaceAt=0,wasSeen=false,faceClose=false;
const hiddenVideo=document.createElement('video');hiddenVideo.autoplay=true;hiddenVideo.muted=true;hiddenVideo.playsInline=true;hiddenVideo.style.cssText='position:fixed;width:1px;height:1px;opacity:0;pointer-events:none';document.body.appendChild(hiddenVideo);
async function detectSetup(){
 if('FaceDetector'in window){try{detector=new FaceDetector({fastMode:true,maxDetectedFaces:1});return}catch(e){}}
 const vision=await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14');
 const files=await vision.FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
 mpDetector=await vision.FaceDetector.createFromOptions(files,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite'},runningMode:'VIDEO',minDetectionConfidence:.5});
}
async function scanFace(){
 if(!cameraStream||hiddenVideo.readyState<2)return;
 try{
  let box=null;
  if(detector){const result=await detector.detect(hiddenVideo);box=result.faces?.[0]?.boundingBox}
  else if(mpDetector){const result=mpDetector.detectForVideo(hiddenVideo,performance.now());box=result.detections?.[0]?.boundingBox}
  if(box){const w=hiddenVideo.videoWidth||320,h=hiddenVideo.videoHeight||240,bx=box.originX??box.x,by=box.originY??box.y,cx=bx+box.width/2,cy=by+box.height/2;
   const nx=Math.max(-1,Math.min(1,1-2*cx/w)),ny=Math.max(-1,Math.min(1,2*cy/h-1)),size=box.width/w,now=performance.now();
   window.faceInfo={seen:true,x:nx,y:ny,size};lastFaceAt=now;tx=nx;ty=ny;
   if(!wasSeen)face('happy',800);wasSeen=true;
   const close=size>.45;if(close&&!faceClose)face('surprise',800);faceClose=close;
  }else if(performance.now()-lastFaceAt>3000){wasSeen=false;faceClose=false;tx=ty=0;window.faceInfo={seen:false,x:0,y:0,size:0}}
 }catch(e){if(performance.now()-lastFaceAt>3000){wasSeen=false;tx=ty=0;window.faceInfo={seen:false,x:0,y:0,size:0}}}
}
document.getElementById('cam').onclick=async()=>{
 if(cameraStream){cameraStream.getTracks().forEach(track=>track.stop());cameraStream=null;hiddenVideo.srcObject=null;clearInterval(cameraTimer);cameraTimer=null;window.faceInfo={seen:false,x:0,y:0,size:0};wasSeen=false;tx=ty=0;return}
 try{cameraStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:320,height:240}});hiddenVideo.srcObject=cameraStream;await hiddenVideo.play();await detectSetup();cameraTimer=setInterval(scanFace,150);scanFace()}
 catch(e){if(cameraStream)cameraStream.getTracks().forEach(track=>track.stop());cameraStream=null;st.textContent='Камера недоступна: '+e.message}
};
async function enterScreen(){try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen()}catch(e){}try{await screen.orientation.lock('landscape')}catch(e){}try{wakeLock=await navigator.wakeLock.request('screen')}catch(e){}}
document.addEventListener('visibilitychange',async()=>{if(document.visibilityState==='visible'&&!wakeLock){try{wakeLock=await navigator.wakeLock.request('screen')}catch(e){}}});
function wake(){lastTouch=performance.now();if(targetMood==='sleep')face('happy')}
function touchReact(){enterScreen();wake();const a=['happy','surprise','love'];face(a[Math.floor(Math.random()*a.length)],850);anim=1}
let holdTimer=null,longHold=false;c.addEventListener('pointerdown',e=>{e.preventDefault();holdTimer=setTimeout(()=>{longHold=true;ui.classList.add('on');face('surprise',700)},700)});c.addEventListener('pointerup',()=>{clearTimeout(holdTimer);if(!longHold)touchReact();longHold=false});c.addEventListener('pointercancel',()=>clearTimeout(holdTimer));
setInterval(()=>{if(performance.now()-lastTouch<120000&&targetMood!=='sleep'){const q=Math.random();if(q<.5){}else if(q<.65)face('surprise',650);else if(q<.8)face('happy',550);else face('sly',700)}},5000);
function eye(cx,cy,r){const ox=(tx||gx)*r*.35,oy=(ty||gy)*r*.3;x.save();x.translate(cx+ox,cy+oy);const h=r*.68,closed=targetMood==='sleep'?1:targetMood==='sly'?.38:blink;x.fillStyle=targetMood==='love'?'#ff5b91':'#50d9ff';
 if(targetMood==='love'){x.beginPath();x.moveTo(0,h*.4);x.bezierCurveTo(-h*1.2,-h*.5,-h*.5,-h*1.25,0,-h*.45);x.bezierCurveTo(h*.5,-h*1.25,h*1.2,-h*.5,0,h*.4);x.fill()}
 else{x.beginPath();x.ellipse(0,0,h,Math.max(2,h*(1-closed)),0,0,7);x.fill();if(closed<.75){x.fillStyle='#122b49';x.beginPath();x.arc((tx||gx)*r*.12,(ty||gy)*r*.12,h*.43,0,7);x.fill();x.fillStyle='white';x.beginPath();x.arc(h*.2,-h*.2,h*.15,0,7);x.fill();x.beginPath();x.arc(-h*.16,h*.15,h*.07,0,7);x.fill()}}x.restore()}
const BLUE='#4fd1ff',INSIDE='#102b52',PINK='#ff6f9f';
// The face features use normalized poses and cross-fade smoothly between filled silhouettes.
const poses={
 normal:{b:[0,0],m:[0,0,0,0,0,0,0,1]},
 happy:{b:[-.04,-.04],m:[1,0,0,0,0,0,0,0]},love:{b:[-.08,-.08],m:[1,0,0,0,0,0,0,0]},
 surprise:{b:[-.36,-.36],m:[0,1,0,0,0,0,0,0]},angry:{b:[.24,.24],m:[0,0,1,0,0,0,0,0]},
 sad:{b:[-.19,-.19],m:[0,0,0,1,0,0,0,0]},sly:{b:[-.24,.04],m:[0,0,0,0,1,0,0,0]},
 think:{b:[-.21,.03],m:[0,0,0,0,0,1,0,0]},sleep:{b:[.04,.04],m:[0,0,0,0,0,0,1,0]}
};
let browPose=[0,0],mouthPose=[0,0,0,0,0,0,0,1];
function mouth(cx,cy,r){
 const shapes=[
  ()=>{x.moveTo(cx-r*.48,cy-r*.08);x.quadraticCurveTo(cx,cy+r*.05,cx+r*.48,cy-r*.08);x.quadraticCurveTo(cx+r*.35,cy+r*.56,cx,cy+r*.62);x.quadraticCurveTo(cx-r*.35,cy+r*.56,cx-r*.48,cy-r*.08)},
  ()=>x.ellipse(cx,cy,r*.22,r*.31,0,0,Math.PI*2),
  ()=>{x.moveTo(cx-r*.43,cy-r*.06);x.quadraticCurveTo(cx-r*.2,cy-r*.25,cx,cy-r*.05);x.quadraticCurveTo(cx+r*.2,cy+r*.16,cx+r*.43,cy-r*.04);x.lineTo(cx+r*.4,cy+r*.18);x.quadraticCurveTo(cx,cy+r*.28,cx-r*.4,cy+r*.16)},
  ()=>{x.moveTo(cx-r*.34,cy+r*.16);x.quadraticCurveTo(cx,cy-r*.04,cx+r*.34,cy+r*.16);x.quadraticCurveTo(cx,cy+r*.03,cx-r*.34,cy+r*.16)},
  ()=>{x.moveTo(cx-r*.4,cy+r*.02);x.quadraticCurveTo(cx-r*.08,cy+r*.28,cx+r*.08,cy+r*.04);x.quadraticCurveTo(cx+r*.27,cy-r*.13,cx+r*.43,cy-r*.2);x.quadraticCurveTo(cx+r*.22,cy+r*.29,cx-r*.4,cy+r*.02)},
  ()=>{x.moveTo(cx-r*.43,cy+r*.08);x.quadraticCurveTo(cx-r*.21,cy+r*.02,cx-r*.13,cy+r*.12);x.quadraticCurveTo(cx+r*.06,cy+r*.25,cx+r*.23,cy+r*.08);x.quadraticCurveTo(cx+r*.33,cy+.01*r,cx+r*.43,cy+r*.05);x.quadraticCurveTo(cx+r*.04,cy+r*.29,cx-r*.43,cy+r*.08)},
  ()=>{x.moveTo(cx-r*.2,cy);x.quadraticCurveTo(cx-r*.08,cy-r*.12,cx,cy);x.quadraticCurveTo(cx+r*.08,cy+r*.12,cx+r*.2,cy)},
  ()=>{x.moveTo(cx-r*.32,cy);x.quadraticCurveTo(cx,cy+r*.22,cx+r*.32,cy);x.quadraticCurveTo(cx,cy+r*.1,cx-r*.32,cy)}
 ];
 x.save();x.fillStyle=INSIDE;x.strokeStyle=BLUE;x.lineWidth=r*.09;x.lineJoin='round';x.lineCap='round';
 mouthPose.forEach((w,i)=>{if(w<.01||!shapes[i])return;x.globalAlpha=Math.min(1,w*1.4);x.beginPath();shapes[i]();if(i!==6)x.closePath();x.fill();x.stroke()});
 // A little tongue peeks out only from the cheerful open mouth.
 if(mouthPose[0]>.35){x.globalAlpha=mouthPose[0];x.fillStyle=PINK;x.beginPath();x.ellipse(cx,cy+r*.39,r*.18,r*.09,0,0,Math.PI*2);x.fill()}
 if(speaking&&talk>.01){x.globalAlpha=1;x.fillStyle=INSIDE;x.strokeStyle=BLUE;x.lineWidth=r*.07;x.beginPath();x.ellipse(cx,cy+r*.1,r*.2,r*(.03+.2*talk),0,0,Math.PI*2);x.fill();x.stroke()}
 x.restore();
}
function brow(cx,cy,r,pose,side,t){
 const lift=pose+(blink>0?Math.sin((1-blink)*Math.PI)*.045:0);
 const outer=side<0?cx-r*2.12:cx+r*2.12,inner=side<0?cx-r*1.08:cx+r*1.08;
 const base=cy-r*(targetMood==='surprise'?1.25:1.0),y1=base-lift*r*.8,y2=base+lift*r*.8,cyc=base-r*.28;
 x.strokeStyle=BLUE;x.lineWidth=r*.16;x.lineCap='round';x.lineJoin='round';x.beginPath();
 if(side<0){x.moveTo(outer,y1);x.quadraticCurveTo(cx-r*1.62,cyc,inner,y2)}
 else{x.moveTo(inner,y2);x.quadraticCurveTo(cx+r*1.62,cyc,outer,y1)}x.stroke();
}
function interpolateFace(dt){const p=poses[targetMood]||poses.normal,k=1-Math.exp(-dt/150);for(let i=0;i<2;i++)browPose[i]+=(p.b[i]-browPose[i])*k;for(let i=0;i<mouthPose.length;i++)mouthPose[i]+=(p.m[i]-mouthPose[i])*k}
function frame(t){const dt=Math.min(40,t-(frame.prev||t));frame.prev=t;if(t-lastTouch>120000&&targetMood!=='sleep'){targetMood='sleep';moodChanged=t;}if(blink>0)blink=Math.max(0,blink-dt/100);else if(t>nextBlink){blink=1;nextBlink=t+3000+Math.random()*3500}interpolateFace(dt);gx+=(Math.sin(t/2000)*.12-gx)*.025;gy+=(Math.cos(t/2400)*.07-gy)*.025;if(speaking){const elapsed=t-lastBoundary;const pulse=lastBoundary?Math.max(0,1-elapsed/220):0;talkNoise+=(Math.sin(t*.045)*.5+.5-talkNoise)*.22;talk=Math.max(pulse,talkNoise*.22)}else talk=Math.max(0,talk-dt/90);anim=Math.max(0,anim-dt/800);mood=targetMood;
 x.fillStyle='#000';x.fillRect(0,0,W,H);const r=Math.min(W/6,H/3.2),breathe=1+Math.sin(t/900)*.012,progress=Math.min(1,(t-moodChanged)/260),ease=1-Math.pow(1-progress,3);x.save();x.globalAlpha=.55+.45*ease;x.translate(0,Math.sin(t/950)*r*.012);x.scale(breathe*(.92+.08*ease),breathe*(.92+.08*ease));
 if(['happy','love'].includes(mood))for(const q of [-1,1]){x.fillStyle='rgba(255,105,145,.25)';x.beginPath();x.ellipse(W/2+q*r*2.22,H*.48,r*.28,r*.16,0,0,7);x.fill()}
 eye(W/2-r*1.6,H*.42,r);eye(W/2+r*1.6,H*.42,r);
 brow(W/2,H*.42,r,browPose[0],-1,t);brow(W/2,H*.42,r,browPose[1],1,t);mouth(W/2,H*.78,r);
 if(mood==='think'){x.font=`${r*.55}px sans-serif`;x.fillText('…',W/2+r*2.2,H*.22)}if(mood==='sleep'){x.font=`${r*.5}px sans-serif`;x.fillText('z z',W/2+r*2,H*.22+Math.sin(t/400)*10)}x.restore();requestAnimationFrame(frame)}
requestAnimationFrame(frame);
</script></body></html>
