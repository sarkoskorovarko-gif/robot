function eye(cx,cy,r,side,t){const w=r*.78,h=r*.93,op=mood==='sleep'?.035:Math.max(.055,1-Math.min(.96,Math.max(eyePose.top,blink)*.95+Math.max(eyePose.bottom,blink)*.55));x.save();x.translate(cx+gx*r*.19,cy+gy*r*.15);x.rotate(eyePose.tilt*side);x.scale(1,op);
